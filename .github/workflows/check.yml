name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_flow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Build and install pinned source dependencies
        run: bun run setup:deps
      - name: Lint, types, unit and DOM tests, production builds
        run: bun run check
      - name: PostgreSQL and durable execution integration
        run: bun run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_flow_test
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser interactions and layout
        run: bun run test:browser
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_flow_test
